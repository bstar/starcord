# cargo-deny: what the dependency tree is allowed to contain.
#
# Two questions, both of which someone has to answer eventually and neither of
# which anyone answers by hand: is a dependency carrying a known vulnerability,
# and is one carrying a licence this project cannot ship under.

[advisories]
# Vulnerabilities and yanked releases stop the build. Those are ours to act on
# however deep in the tree they are: the fix is a version bump, and if there is
# not one yet that is worth knowing today rather than at release.
#
# This matters more here than in a music player. Everything in this tree either
# terminates TLS, decompresses a stream somebody else produced, or parses JSON
# that arrived over a socket.
yanked = "deny"

# Unmaintained crates only when we depend on one directly. A crate we chose and
# that has since been abandoned is a decision to revisit; one three levels down
# is its parent's decision, not ours, and cannot be fixed here.
unmaintained = "workspace"

# One exception, and it is the only one.
#
#   RUSTSEC-2023-0071  The Marvin attack against `rsa` 0.9: RSA decryption there
#                      is not constant time, so an attacker who can watch the
#                      timing of many decryptions with one key may recover it.
#                      There is no fixed release -- RustCrypto's constant-time
#                      rewrite is unfinished -- and no other pure-Rust crate
#                      implements RSA-OAEP, so this is "use it or have no QR
#                      login".
#
#                      What the advisory needs and this does not give it: a
#                      long-lived key and an attacker who can make it decrypt
#                      repeatedly while timing the answers. The key here is
#                      generated for one login attempt, decrypts exactly three
#                      payloads -- a nonce, the scanner's name, the token --
#                      and is dropped when the socket closes, which is within
#                      six minutes either way. The only party who could issue
#                      those decryptions is Discord's own remote-auth gateway,
#                      and what it would recover is a key that has already
#                      delivered everything it protects and is about to cease
#                      to exist.
#
#                      Revisit when `rsa` 0.10 ships; the fix is a version bump
#                      and deleting this paragraph.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
# Everything in the tree today, and nothing else. Adding a dependency under a
# licence not on this list is meant to stop CI and be a decision.
#
# The list is shorter than STAR/AMP's because there is no ffmpeg and no C in
# here at all. One entry is worth knowing about --
#
#   CDLA-Permissive-2.0   webpki-roots. It is not code: it is Mozilla's CA
#                         list, which is published under that licence rather
#                         than under the crate's own.
#   MPL-2.0               nucleo-matcher, which ranks the quick switcher's
#                         results. Copyleft per *file*: using it as a library
#                         carries no obligation beyond publishing changes to
#                         its own files, and there are none.
#   BSL-1.0               error-code, under clipboard-win, under arboard. It
#                         is a Windows path that never builds here, and the
#                         Boost licence is permissive with no attribution
#                         requirement for a binary in any case.
#
# One entry that is *not* here and might be expected to be: OpenSSL, which
# `ring` used to be reported under and no longer is. `cargo deny check
# licenses` warns about an allowance nothing matches, so an entry that stops
# being needed shows up as a warning rather than sitting here forever.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# A crate offering a choice takes the first of these it can satisfy, so a
# dual-licensed dependency resolves to the permissive half rather than to
# whatever its manifest happens to list first.
[licenses.private]
ignore = true

[bans]
# Duplicate versions of one crate are ordinary in a tree this size and are the
# resolver's business, not a licence question.
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Nothing from a git URL or a private registry: everything comes from crates.io,
# so a compromised or vanished repository cannot reach a build.
unknown-registry = "deny"
unknown-git = "deny"

# The one exception, named rather than allowed by loosening the rule above.
# STAR/KIT is this project's other half and is pinned to a tag; it is not
# published to crates.io because its API is whatever its two consumers need and
# a version on a registry would suggest otherwise.
allow-git = ["https://github.com/bstar/starkit"]
